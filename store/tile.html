<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Store tile</title>
  <!-- For shots.cjs only (not part of Memoir): the 440 × 280 small promo tile. The clock at 10:10 and
       MEMOIR as everywhere in the app (the trailer's style), with one line under them. -->
  <script src="../shared/theme-boot.js"></script>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="../shared/logo.css">
  <style>
    html, body { width: 440px; height: 280px; margin: 0; overflow: hidden; }
    body { display: grid; place-content: center; justify-items: center; gap: 18px; background: var(--bg); }
    .lockup { display: flex; align-items: center; gap: 20px; }
    .lockup .logo { width: 76px; height: 76px; flex: none; }
    .lockup .wordmark { font-size: 46px; }
    .line { margin: 0; font-family: var(--font); font-size: 16px; font-weight: 500; color: var(--label-2); letter-spacing: -0.01em; }
  </style>
</head>
<body>
  <div class="lockup">
    <span class="logo themed" aria-hidden="true"><span class="lg-clock"><i class="lg-ring"></i><i class="lg-sec"><i class="lg-knob"></i></i><i class="lg-min"></i><i class="lg-hour"></i></span></span>
    <span class="wordmark">Memoir</span>
  </div>
  <p class="line">Where your browsing time goes</p>
</body>
</html>
